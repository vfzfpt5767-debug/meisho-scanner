# LINEのボタン・返信（中継役の Cloudflare Workers から repository_dispatch で届く）を処理する。
# holdings.csv・cash.csv を直して main に保存 → LINEで「記録しました：…」を送る → ページを作り直す
name: line-event

on:
  repository_dispatch:
    types: [line-event]

permissions:
  contents: write
  actions: write

# concurrency（同時に1つ）は使わない：待ちが2つ以上になると、GitHub が古い待ちを取り消してしまい、
# ボタンを続けて押したときに1件が消えていた（2026-11-13 22:59 の「別の注文をした」）。
# 代わりに下の「前に届いた分を待つ」で順番を守り、保存はやり直しつき（fetch → 処理 → push）で重ならないようにする。

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 前に届いたLINEの処理が終わるのを待つ（届いた順に処理する）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 36); do
            n=$(gh run list --workflow line-event.yml --limit 30 --json databaseId,status \
                --jq '[.[] | select(.databaseId < ${{ github.run_id }} and (.status | test("queued|in_progress|waiting|pending|requested")))] | length' \
                || echo 0)
            if [ "$n" = "0" ]; then break; fi
            echo "前の処理 ${n} 件を待っています"
            sleep 5
          done

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: 記録を直して main に保存
        id: rec
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m scanner.line_actions process
            git add data holdings.csv cash.csv
            if git diff --cached --quiet; then break; fi
            git commit -q -m "LINE: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST の記録"
            if git push -q origin HEAD:main; then break; fi
            sleep 3
          done

      - name: 結果をLINEで送る
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m scanner.line_actions send

      - name: 確認の答えでAIをもう一度起動（答えが届いたときだけ）
        env:
          ANALYST_FIRE_URL: ${{ secrets.ANALYST_FIRE_URL }}
          ANALYST_FIRE_TOKEN: ${{ secrets.ANALYST_FIRE_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m scanner.line_actions fire

      - name: ページを作り直す（scan を起動）
        if: steps.rec.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref main -f skip_ai=true  # ページだけ作り直す（AIは起動しない）

      - name: 失敗をLINEで通知
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m scanner.notify --failure "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
