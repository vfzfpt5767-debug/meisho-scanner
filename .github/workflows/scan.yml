# 夜の好材料スキャナーを自動実行して、GitHub Pages に公開する。
# 時刻は日本時間（JST）→ UTC に変換して書いている（JST = UTC + 9時間）。
#   16:10 JST = 07:10 UTC / 17:10 = 08:10 / 18:40 = 09:40 / 20:40 = 11:40 / 22:40 = 13:40
#   朝レポート 6:20 JST = 21:20 UTC / 7:05 JST = 22:05 UTC（UTCでは前日）
# 土日は cron で除外。祝日・年末年始はスクリプト側（scanner.calendar_jp）で判定して実行しない。
# 手動実行（Actions タブの「Run workflow」）なら休業日でも実行する。
# ※ GitHub の都合で、予定時刻から数分〜数時間遅れることがある（2026-11-04 は16:10〜20:40が1回も動かなかった）。
#   そのため本番の起動は Cloudflare Worker（worker/line-webhook.js の scheduled()）が repository_dispatch（event_type=scan）で行う。
#   ここの schedule は予備。同じタームで何回動いても、LINE・AIの起動は重複しないようになっている。
#   20:55 JST（11:55 UTC）は、21:15 のAIアナリストの前に入力を新しくするための回。
name: scan

on:
  schedule:
    - cron: "10 7 * * 1-5"
    - cron: "10 8 * * 1-5"
    - cron: "40 9 * * 1-5"
    - cron: "40 11 * * 1-5"
    - cron: "55 11 * * 1-5"
    - cron: "40 13 * * 1-5"
    # 朝レポート 6:20 JST = 21:20 UTC（前日）/ 7:05 JST = 22:05 UTC（前日）。日〜木のUTC＝月〜金のJST
    - cron: "20 21 * * 0-4"
    - cron: "5 22 * * 0-4"
  repository_dispatch:
    types: [scan]  # Cloudflare Worker の定時起動（時刻指定と同じ扱い：休業日は動かさない）
  workflow_dispatch:
    inputs:
      skip_ai:
        description: "AIアナリストを起動しない（AIの判断の取り込み・LINEの記録のあとのページ作り直し用）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: 営業日チェック
        id: cal
        # Cloudflare からの定時起動（repository_dispatch）は schedule と同じ扱い（休業日はスキャンしない）
        run: python -m scanner.calendar_jp --event "${{ github.event_name == 'repository_dispatch' && 'schedule' || github.event_name }}" | tee -a "$GITHUB_OUTPUT"

      - name: スキャン実行
        if: steps.cal.outputs.run == 'true'
        env:
          SKIP_AI: ${{ inputs.skip_ai == true && 'true' || 'false' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m scanner

      - name: 結果をリポジトリに保存
        if: steps.cal.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs holdings.csv cash.csv
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "scan: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      - name: AIアナリストを起動（新しいS・A・要確認・保有警告があるときだけ。ページ作り直しのときは起動しない）
        if: steps.cal.outputs.run == 'true' && inputs.skip_ai != true
        env:
          ANALYST_FIRE_URL: ${{ secrets.ANALYST_FIRE_URL }}
          ANALYST_FIRE_TOKEN: ${{ secrets.ANALYST_FIRE_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -m scanner.ai_fire
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "AI fire state"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      # ---- ページの公開（ここだけが失敗しても、データ・LINE・AIは正常なので「失敗」にしない）----
      # 2026-11-20 6:46（#231）：アップロードの直後に deploy-pages が「github-pages が0件」と言って失敗した（GitHub 側の一時的な不具合。
      # 次の実行で直った）。そこで、準備・アップロード・公開は continue-on-error（失敗しても先へ進む）にして、
      # 公開が失敗したら60秒待って1回だけやり直す。やり直しても失敗したら、その回はLINEを送らず data/pages_state.json に数え、
      # 次の実行でも続けて失敗したときだけLINEで1回知らせる（scanner/pages_status.py）。
      # deploy-pages は呼ぶたびに独立して動き（後片付けの post 処理はない）、同じ実行のアーティファクトを探し直すので、同じジョブで2回動かしてよい。
      - name: Pages の準備
        id: pages_cfg
        if: steps.cal.outputs.run == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Pages にアップロード
        id: pages_up
        if: steps.cal.outputs.run == 'true' && steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Pages に公開
        id: deploy
        if: steps.cal.outputs.run == 'true' && steps.pages_up.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pages の公開をやり直す前に60秒待つ
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Pages に公開（やり直し）
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: "300000"  # 5分（ジョブの制限20分に収める）

      - name: ページの公開の結果を記録（続けて失敗したときだけLINE）
        if: steps.cal.outputs.run == 'true'
        continue-on-error: true  # ここが失敗しても「自動実行が失敗しました」は送らない
        env:
          CFG: ${{ steps.pages_cfg.outcome }}
          UP: ${{ steps.pages_up.outcome }}
          D1: ${{ steps.deploy.outcome }}
          D2: ${{ steps.deploy2.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "準備=$CFG アップロード=$UP 公開=$D1 やり直し=${D2:-なし}"
          if [ "$D1" = "success" ] || [ "$D2" = "success" ]; then
            if [ "$D2" = "success" ]; then
              echo "::notice::ページの公開は1回目が失敗し、やり直しで成功しました"
            fi
            python -m scanner.pages_status ok
          else
            echo "::warning::ページの公開に失敗しました（準備=$CFG アップロード=$UP 公開=$D1 やり直し=${D2:-なし}）。データの取得・保存・LINEは正常です。次の実行で直ることが多いです"
            python -m scanner.pages_status fail --run-url "$RUN_URL"
          fi
          for f in data/pages_state.json data/notify_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "pages: 公開の結果を記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi

      - name: 失敗をLINEで通知
        # ページの公開だけの失敗（上の continue-on-error のステップ）はここに来ない。スキャン・保存・AIの起動などの失敗は今までどおりすぐ送る
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -m scanner.notify --failure "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
