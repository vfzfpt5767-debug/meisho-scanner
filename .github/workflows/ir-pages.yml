# 名証上場の会社のIRニュースのページの一覧（data/ir_pages.json）を作り直す。
# 各社の robots.txt で許可されたページだけを、間隔をあけて見る。つながらなかった会社は次の回にやり直す。
# 手動（Actions →「ir-pages」→「Run workflow」）と、毎週月曜 12:17 JST（03:17 UTC）。
name: ir-pages

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ir-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: 一覧を作る
        run: python -m scanner.ir build
      - name: main に保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ir_pages.json
          if ! git diff --cached --quiet; then
            git commit -q -m "IR pages: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 3
            done
          fi
